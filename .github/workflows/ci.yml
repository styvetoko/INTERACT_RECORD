name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: interact
          POSTGRES_PASSWORD: interact
          POSTGRES_DB: interact_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interact"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_SERVER_URL: postgresql://interact:interact@localhost:5432
      DATABASE_URL: postgresql://interact:interact@localhost:5432/interact_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Failles connues dans les dépendances
        run: pnpm audit --audit-level high
      - name: Jetons de design à jour
        run: pnpm --filter @interact/design-tokens test
      - run: pnpm --filter @interact/api prisma:generate
      - run: pnpm --filter @interact/api lint
      - run: pnpm --filter @interact/api build
      - run: pnpm --filter @interact/api test
      - run: pnpm --filter @interact/web lint
      - run: pnpm --filter @interact/web test
      - run: pnpm --filter @interact/web build
        env:
          API_URL: http://localhost:4000
