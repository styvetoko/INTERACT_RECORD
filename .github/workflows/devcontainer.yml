name: Environnement de démonstration

# Vérifie que le Codespace de démonstration se prépare et démarre (base, API, site),
# avec le même docker-compose et les mêmes scripts que Codespaces.
on:
  push:
    branches: ['**']
    paths: ['.devcontainer/**', '.github/workflows/devcontainer.yml']
  workflow_dispatch:

jobs:
  demarrage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conteneurs
        run: docker compose -f .devcontainer/docker-compose.yml up -d
      - name: Préparation (comme postCreateCommand)
        run: docker compose -f .devcontainer/docker-compose.yml exec -T -u root -w /workspaces/INTERACT_RECORD app bash .devcontainer/preparer.sh
      - name: Démarrage (comme postStartCommand) et vérifications
        run: |
          x() { docker compose -f .devcontainer/docker-compose.yml exec -T -u root -w /workspaces/INTERACT_RECORD app bash -c "$1"; }
          x "bash .devcontainer/demarrer.sh"
          sleep 5
          x "curl -sf -o /dev/null -w 'accueil %{http_code}\n' http://localhost:3000/"
          x "curl -sf -o /dev/null -w 'connexion %{http_code}\n' http://localhost:3000/admin/connexion"
          x "curl -s -o /dev/null -w 'admin sans session %{http_code} vers %header{location}\n' http://localhost:3000/admin/comptes"
          x "curl -sf http://localhost:3000/ | grep -q 'Ngono Bikutsi' && echo 'artistes de démonstration visibles'"
          x "curl -sf -o /dev/null -w 'QR code via le site %{http_code}\n' http://localhost:3000/v1/artists/ngono-bikutsi/qr.svg"
          x "curl -sf http://localhost:3000/ngono-bikutsi | grep -o 'src=\"[^\"]*/media/[^\"]*' | head -1 | sed 's/src=\"//' | xargs -I{} curl -sf -o /dev/null -w 'image via le site %{http_code}\n' {}"
          x "curl -s -X POST http://localhost:4000/v1/auth/otp/request -H 'content-type: application/json' -d '{\"phone\":\"699000099\"}' >/dev/null; bash .devcontainer/code-sms.sh"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.yml exec -T -u root app bash -c "tail -n 60 /tmp/interact/*.log" || true
