packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - sharp
# Versions corrigées imposées aux dépendances indirectes (failles connues, voir ADR-0008)
overrides:
  multer: 2.5.0
  file-type: 21.3.4
  postcss: 8.5.23
  sharp: 0.35.5

# Avis acceptés après analyse (ADR-0008) : outils de développement uniquement, jamais exécutés en production.
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx
    - GHSA-gcqx-w48m-w2h4
