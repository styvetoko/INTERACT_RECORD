# Services locaux pour le développement : PostgreSQL, Redis, MinIO (stockage S3)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: interact
      POSTGRES_PASSWORD: interact
      POSTGRES_DB: interact_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: interact
      MINIO_ROOT_PASSWORD: interact-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
